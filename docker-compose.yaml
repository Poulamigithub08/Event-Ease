services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventease-frontend
    ports:
      - "5173:80"
    environment:
      VITE_CHATBOT_URL: http://chatbot:8000
      BACKEND_BASE_URL: http://backend:5000/api
    networks:
      - eventease
    depends_on:
      - backend
      - chatbot

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventease-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/eventease
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - eventease
    depends_on:
      - mongodb

  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: eventease-chatbot
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      MAX_HISTORY: 10
      FRONTEND_URL: http://localhost:5173
    networks:
      - eventease
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: eventease-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - eventease

  mongodb:
    image: mongo:8
    container_name: eventease-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - eventease

volumes:
  ollama_data:
  mongodb_data:

networks:
  eventease:
    driver: bridge
